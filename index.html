<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is a simple one-page site</p>
    </header>

    <main>
        <h2>About</h2>
        <p>This website is made using only one HTML file.</p>

        <button onclick="sayHello()">Click Me</button>
        <p id="message"></p>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function sayHello() {
            document.getElementById("message").innerText = "Hello! Thanks for visiting 😊";
        }
    </script>

</body>
</html>
